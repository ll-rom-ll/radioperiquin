services:
  - type: web
    name: radio-periquin-cloud
    runtime: docker
    plan: free
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: RADIO_ADMIN_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://radioperiquin.onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_MEDIA_BUCKET
        value: radio-periquin-media
      - key: RADIO_ADMIN_RATE_LIMIT
        value: 120
      - key: RADIO_REALTIME_HEARTBEAT_SECONDS
        value: 20
      - key: RADIO_REALTIME_MAX_CLIENTS
        value: 2000

      - key: RADIO_SCHEDULE_CHECK_SECONDS
        value: 20
      - key: RADIO_SCHEDULE_MIN_LEAD_SECONDS
        value: 15
