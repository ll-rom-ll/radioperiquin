services:
  - type: web
    name: radio-periquin-cloud
    runtime: docker
    plan: starter
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: RADIO_ADMIN_TOKEN
        sync: false
      - key: RADIO_STORAGE_ROOT
        value: /var/data/radio-periquin
      - key: RADIO_ADMIN_RATE_LIMIT
        value: 120
    disk:
      name: radio-periquin-data
      mountPath: /var/data
      sizeGB: 1
